<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003d33"/>
      <stop offset="100%" stop-color="#00897b"/>
    </linearGradient>
    <linearGradient id="dna" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="38" fill="url(#bg)"/>
  <!-- Stylised DNA double helix -->
  <g stroke="url(#dna)" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M60 32 C 132 64, 60 96, 132 128 C 60 160, 132 160, 132 160"/>
    <path d="M132 32 C 60 64, 132 96, 60 128 C 132 160, 60 160, 60 160"/>
  </g>
  <!-- Rungs -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <line x1="66"  y1="50"  x2="126" y2="50"/>
    <line x1="78"  y1="72"  x2="114" y2="72"/>
    <line x1="78"  y1="96"  x2="114" y2="96"/>
    <line x1="78"  y1="120" x2="114" y2="120"/>
    <line x1="66"  y1="142" x2="126" y2="142"/>
  </g>
  <!-- Arabic label "أحياء" -->
  <text x="96" y="182" font-family="Tajawal, Arial, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">أحياء ١١</text>
</svg>
